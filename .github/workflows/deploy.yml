name: Deploy Model Canvas

on:
  push:
    branches: [main]
    paths-ignore:
      - deployment-status.txt
      - site/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout status target
        uses: actions/checkout@v4

      - name: Download fresh source build
        id: download
        env:
          BUILD_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-a4b0-8208-9244-f7ae79c6f0a7/raw?se=2026-07-24T06:20:01Z&sp=r&sv=2026-02-06&sr=b&scid=f5e1fab2-cf1b-579d-a829-13b35feeeb4e&skoid=5939c452-ea83-4420-b5b4-21182254a5d3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-24T01:29:56Z&ske=2026-07-26T01:29:56Z&sks=b&skv=2026-02-06&sig=Gygf7sXaOxkz8XqVCZzzb3WQ62mSWV5dT71/wFg99%2BY%3D"
        run: |
          rm -rf site transition build.zip
          curl --fail --location "$BUILD_URL" --output build.zip
          mkdir transition
          unzip -q build.zip -d transition
          test -f transition/dist/index.html
          cp -a transition/dist site
          test -f site/index.html

      - name: Persist verified production payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          git commit -m "Persist verified production payload [skip ci]" || exit 0
          git push

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment result
        if: always()
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          DEPLOY: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "download=$DOWNLOAD"
            echo "configure=$CONFIGURE"
            echo "upload=$UPLOAD"
            echo "deploy=$DEPLOY"
            echo "page_url=$PAGE_URL"
          } > deployment-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.txt
          git commit -m "Record Pages deployment status [skip ci]" || exit 0
          git push